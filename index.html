<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flixie House - Admin Panel & Shop Settings (Cloud Synced)</title>
    <!-- React & ReactDOM CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel CDN -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Client CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Prompt Font -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: 'Prompt', sans-serif;
            margin: 0; padding: 0;
            font-size: 12px;
        }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; height: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: inherit; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #262626; border-radius: 3px; }
        table.fixed-table { table-layout: fixed; width: 100%; min-width: 1250px; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Supabase Client Setup
        const SUPABASE_URL = "https://lxnubaczqktakiinplhl.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_i-CebOKRfmt62mUIlZ94cQ_lInvvH7a";
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        function App() {
            const [activeTab, setActiveTab] = useState(() => {
                return localStorage.getItem('flixie_active_tab_v69') || 'dashboard';
            });

            useEffect(() => {
                localStorage.setItem('flixie_active_tab_v69', activeTab);
            }, [activeTab]);

            const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);

            // Theme State
            const [themeMode, setThemeMode] = useState(() => {
                return localStorage.getItem('flixie_theme_mode') || 'dark';
            });

            useEffect(() => {
                localStorage.setItem('flixie_theme_mode', themeMode);
            }, [themeMode]);

            const isLight = themeMode === 'light';
            const bgMain = isLight ? '#f4f5f7' : '#0d0d0d';
            const bgSidebar = isLight ? '#ffffff' : '#141414';
            const bgCard = isLight ? '#ffffff' : '#141414';
            const borderCol = isLight ? '#e2e8f0' : '#222222';
            const textMain = isLight ? '#1e293b' : '#ffffff';
            const textSub = isLight ? '#64748b' : '#9ca3af';

            // Cloud Save Status Indicator State
            const [saveStatus, setSaveStatus] = useState('กำลังเชื่อมต่อ Cloud...');
            const [isDataLoaded, setIsDataLoaded] = useState(false);

            // Notification Permission State
            const [notifPermission, setNotifPermission] = useState(() => {
                if (typeof window !== 'undefined' && 'Notification' in window) {
                    return Notification.permission;
                }
                return 'default';
            });

            const requestNotificationPermission = async () => {
                if ('Notification' in window) {
                    const permission = await Notification.requestPermission();
                    setNotifPermission(permission);
                    if (permission === 'granted') {
                        alert('เปิดสิทธิ์ Notification สำเร็จ ระบบจะแจ้งเตือนเมื่อมีจอหมดอายุ');
                        new Notification('Flixie House Admin', { body: 'ระบบแจ้งเตือนทำงานเรียบร้อยแล้ว!' });
                    } else {
                        alert('คุณปฏิเสธการอนุญาตการแจ้งเตือน');
                    }
                } else {
                    alert('เบราว์เซอร์นี้ไม่รองรับ Desktop Notification');
                }
            };

            // Toast Notification
            const [toastMessage, setToastMessage] = useState(null);

            const showToast = (text) => {
                setToastMessage(text);
                setTimeout(() => {
                    setToastMessage(null);
                }, 2000);
            };

            const handleCopyText = (text, label) => {
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(text).then(() => {
                        showToast(`คัดลอก ${label}: ${text} สำเร็จ!`);
                    }).catch(err => {
                        fallbackCopyText(text, label);
                    });
                } else {
                    fallbackCopyText(text, label);
                }
            };

            const fallbackCopyText = (text, label) => {
                const textArea = document.createElement("textarea");
                textArea.value = text;
                textArea.style.position = "fixed";
                document.body.appendChild(textArea);
                textArea.focus();
                textArea.select();
                try {
                    const successful = document.execCommand('copy');
                    if (successful) {
                        showToast(`คัดลอก ${label}: ${text} สำเร็จ!`);
                    }
                } catch (err) {}
                document.body.removeChild(textArea);
            };

            // Search Query States
            const [searchQueryProfiles, setSearchQueryProfiles] = useState('');
            const [searchQueryReviews, setSearchQueryReviews] = useState('');
            const [searchQueryHistory, setSearchQueryHistory] = useState('');
            const [searchQueryRevenue, setSearchQueryRevenue] = useState('');

            // Modals State
            const [isNotifModalOpen, setIsNotifModalOpen] = useState(false);
            const [isEditReviewOpen, setIsEditReviewOpen] = useState(false);
            const [editingReview, setEditingReview] = useState(null);

            // Form เพิ่มรีวิว State
            const [newRevCustomer, setNewRevCustomer] = useState('');
            const [newRevPlatform, setNewRevPlatform] = useState('LINE');
            const [newRevRating, setNewRevRating] = useState(10);
            const [newRevComment, setNewRevComment] = useState('');

            // Data States
            const [reviews, setReviews] = useState([]);
            const [shopSettings, setShopSettings] = useState({
                shopName: 'Flixie House',
                lineLink: 'https://line.me/ti/p/~phxjj2550',
                facebookLink: 'https://www.facebook.com/share/18NSTRxELm/?mibextid=wwXIfr',
                description: 'ศูนย์รวมบริการสตรีมมิ่งพรีเมียม จัดการง่าย โปร่งใส ตรวจสอบได้',
                mobilePackages: [
                    { id: 1, name: '1 วัน', days: 1, price: 10 },
                    { id: 2, name: '7 วัน', days: 7, price: 49 },
                    { id: 3, name: '14 วัน', days: 14, price: 89 },
                    { id: 4, name: '30 วัน', days: 30, price: 109 }
                ],
                tvPackages: [
                    { id: 1, name: '1 วัน', days: 1, price: 19 },
                    { id: 2, name: '7 วัน', days: 7, price: 69 },
                    { id: 3, name: '14 วัน', days: 14, price: 109 },
                    { id: 4, name: '30 วัน', days: 30, price: 159 }
                ]
            });
            const [accounts, setAccounts] = useState([]);
            const [sales, setSales] = useState([]);
            const [activities, setActivities] = useState([]);

            // 1. Fetch data from Supabase on load & Setup Real-time subscription
            useEffect(() => {
                async function fetchCloudData() {
                    try {
                        const { data, error } = await supabaseClient
                            .from('flixie_data')
                            .select('*')
                            .eq('id', 'main_store')
                            .single();

                        if (data && data.data) {
                            const store = data.data;
                            if (store.shopSettings) setShopSettings(store.shopSettings);
                            if (store.accounts) setAccounts(store.accounts);
                            if (store.sales) setSales(store.sales);
                            if (store.reviews) setReviews(store.reviews);
                            if (store.activities) setActivities(store.activities);
                        }
                    } catch (err) {
                        console.error('Error fetching cloud data:', err);
                    }
                    setIsDataLoaded(true);
                    setSaveStatus('ซิงค์ Cloud เรียบร้อย (Real-time)');
                }
                fetchCloudData();

                const channel = supabaseClient
                    .channel('public:flixie_data')
                    .on('postgres_changes', { event: '*', schema: 'public', table: 'flixie_data', filter: 'id=eq.main_store' }, (payload) => {
                        if (payload.new && payload.new.data) {
                            const store = payload.new.data;
                            if (store.shopSettings) setShopSettings(store.shopSettings);
                            if (store.accounts) setAccounts(store.accounts);
                            if (store.sales) setSales(store.sales);
                            if (store.reviews) setReviews(store.reviews);
                            if (store.activities) setActivities(store.activities);
                            setSaveStatus('อัปเดตจาก Cloud แล้ว');
                        }
                    })
                    .subscribe();

                return () => {
                    supabaseClient.removeChannel(channel);
                };
            }, []);

            // 2. Save to Supabase function
            const saveToCloud = async (overrideData) => {
                if (!isDataLoaded) return;
                setSaveStatus('กำลังซิงค์ไป Cloud...');
                
                const currentStoreData = overrideData || {
                    shopSettings,
                    accounts,
                    sales,
                    reviews,
                    activities
                };

                try {
                    const { error } = await supabaseClient
                        .from('flixie_data')
                        .upsert({ id: 'main_store', data: currentStoreData });

                    if (error) {
                        console.error('Cloud save error:', error);
                        setSaveStatus('เกิดข้อผิดพลาดในการซิงค์ Cloud');
                    } else {
                        setSaveStatus('ซิงค์ Cloud เรียบร้อย (Real-time)');
                    }
                } catch (err) {
                    console.error('Cloud save exception:', err);
                    setSaveStatus('เกิดข้อผิดพลาดในการซิงค์ Cloud');
                }
            };

            const updateStateAndSync = (updater, stateType) => {
                if (stateType === 'shopSettings') {
                    setShopSettings(prev => {
                        const next = typeof updater === 'function' ? updater(prev) : updater;
                        saveToCloud({ shopSettings: next, accounts, sales, reviews, activities });
                        return next;
                    });
                } else if (stateType === 'accounts') {
                    setAccounts(prev => {
                        const next = typeof updater === 'function' ? updater(prev) : updater;
                        saveToCloud({ shopSettings, accounts: next, sales, reviews, activities });
                        return next;
                    });
                } else if (stateType === 'sales') {
                    setSales(prev => {
                        const next = typeof updater === 'function' ? updater(prev) : updater;
                        saveToCloud({ shopSettings, accounts, sales: next, reviews, activities });
                        return next;
                    });
                } else if (stateType === 'reviews') {
                    setReviews(prev => {
                        const next = typeof updater === 'function' ? updater(prev) : updater;
                        saveToCloud({ shopSettings, accounts, sales, reviews: next, activities });
                        return next;
                    });
                } else if (stateType === 'activities') {
                    setActivities(prev => {
                        const next = typeof updater === 'function' ? updater(prev) : updater;
                        saveToCloud({ shopSettings, accounts, sales, reviews, activities: next });
                        return next;
                    });
                }
            };

            const playAlertSound = () => {
                try {
                    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                    const osc = audioCtx.createOscillator();
                    const gainNode = audioCtx.createGain();

                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(587.33, audioCtx.currentTime);
                    osc.frequency.setValueAtTime(880, audioCtx.currentTime + 0.15);

                    gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.8);

                    osc.connect(gainNode);
                    gainNode.connect(audioCtx.destination);

                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.8);
                } catch(e) {}
            };

            const parseExpiryDate = (expiryStr) => {
                if (!expiryStr || expiryStr === '-') return null;
                try {
                    const parts = expiryStr.split(' ');
                    if (parts.length >= 2) {
                        const dateParts = parts[0].split('/');
                        const timeParts = parts[1].split(':');
                        if (dateParts.length === 3 && timeParts.length >= 2) {
                            const d = parseInt(dateParts[0], 10);
                            const m = parseInt(dateParts[1], 10) - 1;
                            const y = parseInt(dateParts[2], 10);
                            const h = parseInt(timeParts[0], 10);
                            const min = parseInt(timeParts[1], 10);
                            return new Date(y, m, d, h, min, 0);
                        }
                    }
                } catch(e) {}
                return null;
            };

            // ระบบตรวจสอบจอหมดอายุอัตโนมัติทุกๆ 1 นาที (พร้อมเสียงเตือนและ Browser Notification ทันทีที่พบจอหมดเวลาใหม่)
            useEffect(() => {
                if (!isDataLoaded || accounts.length === 0) return;

                const checkExpiryInterval = setInterval(() => {
                    const now = new Date();
                    let hasChanged = false;
                    let newlyExpiredCount = 0;

                    const updated = accounts.map(acc => {
                        let accChanged = false;
                        const newProfiles = acc.profiles.map(p => {
                            const profilePin = p.pin !== undefined ? p.pin : '2008';
                            if (p.status === 'ไม่ว่าง' && p.end && p.end !== '-') {
                                const expDate = parseExpiryDate(p.end);
                                if (expDate && now > expDate) {
                                    if (p.status !== 'หมดเวลา') {
                                        newlyExpiredCount++;
                                    }
                                    accChanged = true;
                                    hasChanged = true;
                                    return { ...p, pin: profilePin, status: 'หมดเวลา' };
                                }
                            }
                            return { ...p, pin: profilePin };
                        });
                        return accChanged ? { ...acc, profiles: newProfiles } : acc;
                    });

                    if (hasChanged) {
                        updateStateAndSync(updated, 'accounts');
                        playAlertSound();
                        if ('Notification' in window && Notification.permission === 'granted') {
                            new Notification('🚨 แจ้งเตือนจอ Netflix หมดอายุ!', {
                                body: `มีจอหมดอายุใหม่ ${newlyExpiredCount} จอ กรุณาตรวจสอบและกดคืนจอในระบบ`,
                                icon: 'https://cdn-icons-png.flaticon.com/512/564/564619.png'
                            });
                        }
                    }
                }, 60000); // ทุก 1 นาที

                return () => clearInterval(checkExpiryInterval);
            }, [isDataLoaded, accounts]);

            const handleSaveNewReview = (e) => {
                e.preventDefault();
                if (!newRevCustomer || !newRevComment) {
                    alert('กรุณากรอกชื่อลูกค้าและข้อความความคิดเห็น');
                    return;
                }
                const now = new Date();
                const dateStr = `${String(now.getDate()).padStart(2,'0')}/${String(now.getMonth()+1).padStart(2,'0')}/${now.getFullYear()}`;
                const newRev = {
                    id: Date.now(),
                    dateStr,
                    customer: newRevCustomer,
                    rating: parseInt(newRevRating) || 10,
                    comment: newRevComment,
                    platform: newRevPlatform
                };
                updateStateAndSync([newRev, ...reviews], 'reviews');
                setNewRevCustomer('');
                setNewRevComment('');
                setNewRevRating(10);
                setNewRevPlatform('LINE');
                alert('บันทึกรีวิวสำเร็จ!');
            };

            const handleUpdateReview = (e) => {
                e.preventDefault();
                if (!editingReview) return;
                const updated = reviews.map(r => r.id === editingReview.id ? editingReview : r);
                updateStateAndSync(updated, 'reviews');
                setIsEditReviewOpen(false);
                setEditingReview(null);
                alert('แก้ไขรีวิวสำเร็จ!');
            };

            const handleDeleteReview = (id) => {
                if (confirm('คุณต้องการลบรีวิวนี้ใช่หรือไม่?')) {
                    const updated = reviews.filter(r => r.id !== id);
                    updateStateAndSync(updated, 'reviews');
                    alert('ลบรีวิวสำเร็จ');
                }
            };

            const fileInputRef = useRef(null);

            const handleExportBackup = () => {
                const backupData = {
                    version: "1.0",
                    timestamp: new Date().toISOString(),
                    shopSettings,
                    accounts,
                    sales,
                    reviews,
                    activities
                };
                const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(backupData, null, 2));
                const downloadAnchor = document.createElement('a');
                downloadAnchor.setAttribute("href", dataStr);
                downloadAnchor.setAttribute("download", `flixie_house_backup_${new Date().toISOString().slice(0,10)}.json`);
                document.body.appendChild(downloadAnchor);
                downloadAnchor.click();
                downloadAnchor.remove();
                alert('ดาวน์โหลดไฟล์สำรองข้อมูลสำเร็จ!');
            };

            const handleImportBackup = (e) => {
                const fileReader = new FileReader();
                if (e.target.files[0]) {
                    fileReader.readAsText(e.target.files[0], "UTF-8");
                    fileReader.onload = (event) => {
                        try {
                            const parsed = JSON.parse(event.target.result);
                            if (parsed.accounts && parsed.shopSettings) {
                                const newStore = {
                                    shopSettings: parsed.shopSettings,
                                    accounts: parsed.accounts || [],
                                    sales: parsed.sales || [],
                                    reviews: parsed.reviews || [],
                                    activities: parsed.activities || []
                                };
                                setShopSettings(newStore.shopSettings);
                                setAccounts(newStore.accounts);
                                setSales(newStore.sales);
                                setReviews(newStore.reviews);
                                setActivities(newStore.activities);
                                saveToCloud(newStore);
                                alert('กู้คืนข้อมูลสำรองและซิงค์ขึ้น Cloud สำเร็จเรียบร้อยแล้ว!');
                            } else {
                                alert('ไฟล์สำรองข้อมูลไม่ถูกต้อง');
                            }
                        } catch (error) {
                            alert('เกิดข้อผิดพลาดในการอ่านไฟล์ JSON');
                        }
                    };
                }
            };

            const getExpiredProfilesOnly = () => {
                let list = [];
                const now = new Date();

                accounts.forEach(acc => {
                    acc.profiles.forEach(p => {
                        if (p.status === 'หมดเวลา') {
                            list.push({ ...p, accId: acc.id, email: acc.email });
                        } else if (p.status === 'ไม่ว่าง' && p.end && p.end !== '-') {
                            const expDate = parseExpiryDate(p.end);
                            if (expDate && now > expDate) {
                                list.push({ ...p, accId: acc.id, email: acc.email });
                            }
                        }
                    });
                });
                return list;
            };

            const expiredList = getExpiredProfilesOnly();

            const [isAddModalOpen, setIsAddModalOpen] = useState(false);
            const [formName, setFormName] = useState('');
            const [formEmail, setFormEmail] = useState('');
            const [formPassword, setFormPassword] = useState('');
            const [formProfilesCount, setFormProfilesCount] = useState(5);
            const [formNote, setFormNote] = useState('');

            const [isEditModalOpen, setIsEditModalOpen] = useState(false);
            const [editingAccount, setEditingAccount] = useState(null);

            const [isAddCustomerOpen, setIsAddCustomerOpen] = useState(false);
            const [selectedProfileForCustomer, setSelectedProfileForCustomer] = useState(null);
            const [custName, setCustName] = useState('');
            const [custContact, setCustContact] = useState('LINE');
            const [custDevice, setCustDevice] = useState('มือถือ');
            
            const getTodayDDMMYYYY = () => {
                const d = new Date();
                const day = String(d.getDate()).padStart(2, '0');
                const month = String(d.getMonth() + 1).padStart(2, '0');
                const year = d.getFullYear();
                return `${day}/${month}/${year}`;
            };

            const getCurrentTimeHHMM = () => {
                const d = new Date();
                const h = String(d.getHours()).padStart(2, '0');
                const m = String(d.getMinutes()).padStart(2, '0');
                return `${h}:${m}`;
            };

            const [custDate, setCustDate] = useState(getTodayDDMMYYYY());
            const [custTime, setCustTime] = useState(getCurrentTimeHHMM());
            const [custDuration, setCustDuration] = useState('7 วัน');
            const [custCustomPrice, setCustCustomPrice] = useState('');

            const getAutoPrice = () => {
                let pkgList = custDevice === 'Smart TV' ? shopSettings.tvPackages : shopSettings.mobilePackages;
                let found = pkgList.find(p => p.name === custDuration);
                if (found) return found.price;
                return custDevice === 'Smart TV' ? 69 : 49;
            };

            const finalPrice = custCustomPrice !== '' ? parseFloat(custCustomPrice) || 0 : getAutoPrice();

            const parseDDMMYYYY = (dateStr) => {
                try {
                    const parts = dateStr.split('/');
                    if (parts.length === 3) {
                        const d = parseInt(parts[0], 10);
                        const m = parseInt(parts[1], 10) - 1;
                        const y = parseInt(parts[2], 10);
                        return new Date(y, m, d);
                    }
                } catch(e) {}
                return new Date();
            };

            const calculateExpiry = () => {
                let daysNum = 7;
                if (custDuration.includes('1 วัน')) daysNum = 1;
                else if (custDuration.includes('7 วัน')) daysNum = 7;
                else if (custDuration.includes('14 วัน')) daysNum = 14;
                else if (custDuration.includes('30 วัน')) daysNum = 30;

                try {
                    let baseDate = parseDDMMYYYY(custDate);
                    let [h, min] = (custTime || '17:24').split(':').map(Number);
                    baseDate.setHours(h || 0, min || 0, 0, 0);
                    baseDate.setDate(baseDate.getDate() + daysNum);

                    let ed = String(baseDate.getDate()).padStart(2, '0');
                    let em = String(baseDate.getMonth() + 1).padStart(2, '0');
                    let ey = baseDate.getFullYear();
                    let eh = String(baseDate.getHours()).padStart(2, '0');
                    let emin = String(baseDate.getMinutes()).padStart(2, '0');

                    return `${ed}/${em}/${ey} ${eh}:${emin} น.`;
                } catch(e) {
                    return '11/11/2026 17:24 น.';
                }
            };

            const getFormattedStartStr = () => {
                try {
                    const [h, min] = (custTime || '17:24').split(':');
                    return `${custDate} ${h}:${min} น.`;
                } catch(e) {
                    return `${custDate} ${custTime} น.`;
                }
            };

            const handleCreateAccount = (e) => {
                e.preventDefault();
                if (!formEmail || !formPassword) {
                    alert('กรุณากรอกอีเมลและรหัสผ่าน Netflix');
                    return;
                }

                const count = parseInt(formProfilesCount) || 5;
                const newProfiles = [];
                for (let i = 1; i <= count; i++) {
                    newProfiles.push({
                        id: i,
                        userLabel: `FH - User ${i}`,
                        pin: String(Math.floor(1000 + Math.random() * 9000)),
                        status: 'ว่าง',
                        customer: '-',
                        contact: '-',
                        start: '-',
                        end: '-',
                        device: '-',
                        duration: '-'
                    });
                }

                const newAcc = {
                    id: Date.now(),
                    name: formName ? formName : 'Netflix Hub',
                    email: formEmail,
                    password: formPassword,
                    collapsed: false,
                    note: formNote,
                    profiles: newProfiles
                };

                const updatedAccs = [...accounts, newAcc];
                updateStateAndSync(updatedAccs, 'accounts');
                setIsAddModalOpen(false);
                setFormName('');
                setFormEmail('');
                setFormPassword('');
                setFormProfilesCount(5);
                setFormNote('');

                const startOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
                const sevenDaysAgo = now.getTime() - (7 * 24 * 60 * 60 * 1000);
                const thirtyDaysAgo = now.getTime() - (30 * 24 * 60 * 60 * 1000);

                let todayRev = 0;
                let sevenDaysRev = 0;
                let thirtyDaysRev = 0;
                let totalRev = 0;

                sales.forEach(s => {
                    const amt = parseFloat(s.amount) || 0;
                    totalRev += amt;

                    let saleTime = s.rawDate ? new Date(s.rawDate).getTime() : null;
                    if (!saleTime && s.dateStr) {
                        const parsed = parseExpiryDate(s.dateStr);
                        if (parsed) saleTime = parsed.getTime();
                    }

                    if (saleTime) {
                        if (saleTime >= startOfToday) todayRev += amt;
                        if (saleTime >= sevenDaysAgo) sevenDaysRev += amt;
                        if (saleTime >= thirtyDaysAgo) thirtyDaysRev += amt;
                    } else {

                        sevenDaysRev += amt;

                                <form onSubmit={handleUpdateAccount} className="space-y-3">
                                    <input type="text" value={editingAccount.name} onChange={e => setEditingAccount({...editingAccount, name: e.target.value})} className="w-full border rounded-xl px-3.5 py-2 text-xs" style={{ backgroundColor: isLight ? '#f8fafc' : '#1c1c1c', borderColor: borderCol, color: textMain }} />
                                    <input type="email" value={editingAccount.email} onChange={e => setEditingAccount({...editingAccount, email: e.target.value})} required className="w-full border rounded-xl px-3.5 py-2 text-xs" style={{ backgroundColor: isLight ? '#f8fafc' : '#1c1c1c', borderColor: borderCol, color: textMain }} />
                                    <input type="text" value={editingAccount.password} onChange={e => setEditingAccount({...editingAccount, password: e.target.value})} required className="w-full border rounded-xl px-3.5 py-2 text-xs" style={{ backgroundColor: isLight ? '#f8fafc' : '#1c1c1c', borderColor: borderCol, color: textMain }} />
                                    <div className="flex justify-end gap-2 pt-2">
                                        <button type="button" onClick={() => setIsEditModalOpen(false)} className="border px-4 py-2 rounded-xl text-xs" style={{ borderColor: borderCol, color: textMain }}>ยกเลิก</button>
                                        <button type="submit" className="bg-[#e50914] text-white px-5 py-2 rounded-xl text-xs font-semibold">บันทึก</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* MODAL: เพิ่มลูกค้าเข้าโปรไฟล์ */}
                    {isAddCustomerOpen && (
                        <div className="fixed inset-0 bg-black/85 backdrop-blur-sm flex items-center justify-center z-50 p-4">
                            <div className="border rounded-2xl w-full max-w-lg shadow-2xl p-6 space-y-4 max-h-[90vh] overflow-y-auto custom-scrollbar" style={{ backgroundColor: bgCard, borderColor: borderCol }}>
                                <div className="flex justify-between items-center border-b pb-3" style={{ borderColor: borderCol }}>
                                    <div>
                                        <h3 className="font-bold text-sm text-white">เพิ่มลูกค้าเข้าโปรไฟล์</h3>
                                        <p className="text-[10px] text-emerald-400 mt-0.5">กำลังเพิ่มเข้า {selectedProfileForCustomer?.userLabel}</p>
                                    </div>
                                    <button onClick={() => setIsAddCustomerOpen(false)} className="text-gray-400 hover:text-white text-sm">✕</button>
                                </div>
                                <form onSubmit={handleSaveCustomer} className="space-y-4">
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                        <div>
                                            <label className="block text-[11px] mb-1.5 text-gray-400">ชื่อลูกค้า</label>
                                            <input 
                                                type="text" 
                                                value={custName} 
                                                onChange={e => setCustName(e.target.value)} 
                                                required 
                                                placeholder="ชื่อลูกค้า" 
                                                className="w-full border rounded-xl px-3.5 py-2.5 text-xs outline-none focus:border-[#e50914]" 
                                                style={{ backgroundColor: isLight ? '#f8fafc' : '#1c1c1c', borderColor: borderCol, color: textMain }} 
                                            />
                                        </div>
                                        <div>
                                            <label className="block text-[11px] mb-1.5 text-gray-400">ช่องทางติดต่อ</label>
                                            <select 
                                                value={custContact} 
                                                onChange={e => setCustContact(e.target.value)} 
                                                className="w-full border rounded-xl px-3.5 py-2.5 text-xs outline-none focus:border-[#e50914]" 
                                                style={{ backgroundColor: isLight ? '#f8fafc' : '#1c1c1c', borderColor: borderCol, color: textMain }}
                                            >
                                                <option value="LINE">LINE</option>
                                                <option value="Facebook">Facebook</option>
                                            </select>
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                        <div>
                                            <label className="block text-[11px] mb-1.5 text-gray-400">วันที่เริ่มต้น</label>
                                            <input 
                                                type="text" 
                                                value={custDate} 
                                                onChange={e => setCustDate(e.target.value)} 
                                                placeholder="DD/MM/YYYY" 
                                                className="w-full border rounded-xl px-3.5 py-2.5 text-xs outline-none focus:border-[#e50914]" 
                                                style={{ backgroundColor: isLight ? '#f8fafc' : '#1c1c1c', borderColor: borderCol, color: textMain }} 
                                            />
                                        </div>
                                        <div>
                                            <label className="block text-[11px] mb-1.5 text-gray-400">เวลาเริ่มต้น</label>
                                            <input 
                                                type="text" 
                                                value={custTime} 
                                                onChange={e => setCustTime(e.target.value)} 
                                                placeholder="HH:MM" 
                                                className="w-full border rounded-xl px-3.5 py-2.5 text-xs outline-none focus:border-[#e50914]" 
                                                style={{ backgroundColor: isLight ? '#f8fafc' : '#1c1c1c', borderColor: borderCol, color: textMain }} 
                                            />
                                        </div>
                                    </div>

                                    <div>
                                        <label className="block text-[11px] mb-1.5 text-gray-400">อุปกรณ์</label>
                                        <select 
                                            value={custDevice} 
                                            onChange={e => setCustDevice(e.target.value)} 
                                            className="w-full border rounded-xl px-3.5 py-2.5 text-xs outline-none focus:border-[#e50914]" 
                                            style={{ backgroundColor: isLight ? '#f8fafc' : '#1c1c1c', borderColor: borderCol, color: textMain }}
                                        >
                                            <option value="มือถือ">มือถือ</option>
                                            <option value="ไอแพด">ไอแพด</option>
                                            <option value="คอมพิวเตอร์">คอมพิวเตอร์</option>
                                            <option value="Smart TV">Smart TV</option>
                                        </select>
                                    </div>

                                    <div>
                                        <label className="block text-[11px] mb-1.5 text-gray-400">ระยะเวลา</label>
                                        <select 
                                            value={custDuration} 
                                            onChange={e => setCustDuration(e.target.value)} 
                                            className="w-full border rounded-xl px-3.5 py-2.5 text-xs outline-none focus:border-[#e50914]" 
                                            style={{ backgroundColor: isLight ? '#f8fafc' : '#1c1c1c', borderColor: borderCol, color: textMain }}
                                        >
                                            <option value="1 วัน">1 วัน</option>
                                            <option value="7 วัน">7 วัน</option>
                                            <option value="14 วัน">14 วัน</option>
                                            <option value="30 วัน">30 วัน</option>
                                        </select>
                                    </div>

                                    <div>
                                        <label className="block text-[11px] mb-1.5 text-gray-400">ราคา (บาท) — เว้นว่างเพื่อใช้ราคาอัตโนมัติ</label>
                                        <input 
                                            type="number" 
                                            value={custCustomPrice} 
                                            onChange={e => setCustCustomPrice(e.target.value)} 
                                            placeholder={`ราคาอัตโนมัติ ฿${getAutoPrice()}`} 
                                            className="w-full border rounded-xl px-3.5 py-2.5 text-xs outline-none focus:border-[#e50914]" 
                                            style={{ backgroundColor: isLight ? '#f8fafc' : '#1c1c1c', borderColor: borderCol, color: textMain }} 
                                        />
                                    </div>

                                    <div className="p-3 border rounded-xl flex justify-between items-center" style={{ backgroundColor: isLight ? '#f8fafc' : '#141414', borderColor: borderCol }}>
                                        <span className="text-[11px] text-gray-400">วันหมดอายุอัตโนมัติ:</span>
                                        <span className="text-xs font-bold text-amber-400">{calculateExpiry()}</span>
                                    </div>

                                    <div className="p-4 border rounded-2xl flex justify-between items-center bg-[#141414]" style={{ borderColor: borderCol }}>
                                        <span className="font-bold text-xs text-white">ราคาที่คิด</span>
                                        <span className="text-lg font-bold text-emerald-400">฿{finalPrice}</span>
                                    </div>

                                    <div className="flex justify-end gap-2 pt-2">
                                        <button type="button" onClick={() => setIsAddCustomerOpen(false)} className="border px-4 py-2.5 rounded-xl text-xs font-semibold" style={{ borderColor: borderCol, color: textMain }}>ยกเลิก</button>
                                        <button type="submit" className="bg-[#e50914] hover:bg-[#b80710] text-white px-6 py-2.5 rounded-xl text-xs font-semibold shadow">บันทึกรายการ</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
